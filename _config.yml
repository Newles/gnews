# -----------------------
# 📑 Configuración General (Versión Free)
# -----------------------
title: "Gnews Free"
email: tu-correo@ejemplo.com
timezone: UTC
baseurl: "/gnews-free-demo" # Si usas GitHub Pages, pon aquí el nombre de tu repo: "/gnews-free"
url: "https://Newles.github.io"
permalink: "/:title/"
author: Fred
paginate: 30
locale: es_es
lang: es_es

# -----------------------
# 🎨 Identidad y Skins
# -----------------------
logo: 'assets/icon/logo.png'
favicon: 'assets/favicon/favicon.ico'
hero: 'assets/img/intro.svg'
skin: "purple" # En la versión Free, solo este skin está disponible por defecto.

# -----------------------
# 🔍 Funciones (Limitadas en Free)
# -----------------------
search_enabled: false # La búsqueda en tiempo real es una función Premium.
search_placeholder: "Buscar..."

# -----------------------
# 💬 Comentarios
# -----------------------
comments:
  provider: "disqus" # Opciones: disqus, giscus, cusdis, false
  disqus:
    shortname: "demowebsite"
  giscus:
    repo: "usuario/repositorio"
    repo_id: "R_..."
    category: "Announcements"
    category_id: "DIC_..."
    mapping: "pathname"
    theme: "light"

# -----------------------
# 👥 Autores
# -----------------------
authors:
  fred:
    name: Fred
    display_name: Fred
    avatar: 'assets/avatar/fred.png'
    email: tu-correo@ejemplo.com
    web: https://tusitio.com
    twitter: https://twitter.com/tu_usuario
    description: "Creador de Gnews. Disfruta de esta versión gratuita y minimalista para tu blog de noticias."

# -----------------------
# 📱 Redes Sociales
# -----------------------
social:
  instagram: https://www.instagram.com/
  facebook: https://www.facebook.com/
  twitter: https://twitter.com/
  whatsapp: false # Desactivado por defecto en la versión Free

# -----------------------
# ⚙️ Configuraciones Técnicas
# -----------------------
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    disable: true # En la versión Free se mantiene simple
sass:
  sass_dir: _sass
  style: :compressed

plugins: 
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  # Nota: jekyll-archives no suele estar en la Free para mantener ligereza